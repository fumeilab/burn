<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burn — LLM Cost Calculator</title>
    <meta name="description" content="Compare LLM API pricing across OpenAI, Anthropic, Google, xAI, Meta, Mistral, DeepSeek, and Qwen. Calculate your monthly costs and find the cheapest model for your usage.">
    <meta name="keywords" content="LLM pricing, API costs, GPT pricing, Claude pricing, Gemini pricing, AI model comparison, token calculator">
    <meta property="og:title" content="Burn — LLM Cost Calculator">
    <meta property="og:description" content="Compare LLM API pricing across every major provider. Input your usage, see what you'll pay.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --surface-hover: #161616;
            --surface-active: #1a1a1a;
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.15);
            --text-primary: #e5e5e5;
            --text-secondary: #888888;
            --text-muted: #555555;
            --accent: #e5e5e5;
            --accent-dim: rgba(229, 229, 229, 0.1);
            --green: #4ade80;
            --green-dim: rgba(74, 222, 128, 0.1);
            --red: #f87171;
            --yellow: #fbbf24;
            --blue: #60a5fa;
            --purple: #c084fc;
            --radius: 8px;
            --radius-sm: 6px;
            --font-heading: 'Space Grotesk', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        header {
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(12px);
            z-index: 100;
        }

        .header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .logo-tag {
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            padding-left: 16px;
            border-left: 1px solid var(--border);
        }

        .header-link {
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.15s;
        }

        .header-link:hover {
            color: var(--text-primary);
        }

        /* Hero Section */
        .hero {
            padding: 64px 0 48px;
            text-align: center;
        }

        .hero h1 {
            font-family: var(--font-heading);
            font-size: 40px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 16px;
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto;
        }

        /* Calculator Section */
        .section {
            margin-bottom: 48px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-title {
            font-family: var(--font-heading);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        /* Calculator Inputs */
        .calc-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 32px;
        }

        .calc-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .calc-field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .calc-input-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .calc-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: var(--border-strong);
            border-radius: 2px;
            outline: none;
        }

        .calc-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .calc-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .calc-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
            border: none;
        }

        .calc-value {
            font-family: var(--font-heading);
            font-size: 18px;
            font-weight: 600;
            min-width: 100px;
            text-align: right;
            color: var(--text-primary);
        }

        .calc-input-num {
            width: 120px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-family: var(--font-heading);
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            text-align: right;
            outline: none;
            transition: border-color 0.15s;
        }

        .calc-input-num:focus {
            border-color: var(--border-strong);
        }

        .calc-unit {
            font-size: 13px;
            color: var(--text-muted);
            min-width: 20px;
        }

        /* Filter Pills */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .filter-pill {
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
        }

        .filter-pill:hover {
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        .filter-pill.active {
            background: var(--accent-dim);
            border-color: rgba(229, 229, 229, 0.25);
            color: var(--text-primary);
        }

        .filter-pill.provider-openai.active { background: rgba(16, 163, 127, 0.12); border-color: rgba(16, 163, 127, 0.3); color: #10a37f; }
        .filter-pill.provider-anthropic.active { background: rgba(204, 138, 74, 0.12); border-color: rgba(204, 138, 74, 0.3); color: #cc8a4a; }
        .filter-pill.provider-google.active { background: rgba(66, 133, 244, 0.12); border-color: rgba(66, 133, 244, 0.3); color: #4285f4; }
        .filter-pill.provider-meta.active { background: rgba(0, 122, 255, 0.12); border-color: rgba(0, 122, 255, 0.3); color: #007aff; }
        .filter-pill.provider-mistral.active { background: rgba(255, 117, 24, 0.12); border-color: rgba(255, 117, 24, 0.3); color: #ff7518; }
        .filter-pill.provider-deepseek.active { background: rgba(74, 144, 226, 0.12); border-color: rgba(74, 144, 226, 0.3); color: #4a90e2; }
        .filter-pill.provider-qwen.active { background: rgba(115, 103, 240, 0.12); border-color: rgba(115, 103, 240, 0.3); color: #7367f0; }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            font-family: var(--font-body);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            text-align: left;
            padding: 12px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
            transition: color 0.15s;
        }

        th:hover {
            color: var(--text-secondary);
        }

        th.sorted {
            color: var(--text-primary);
        }

        .sort-icon {
            display: inline-block;
            margin-left: 4px;
            font-size: 10px;
            opacity: 0.5;
        }

        th.sorted .sort-icon {
            opacity: 1;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: var(--surface-hover);
        }

        tr.selected td {
            background: var(--accent-dim);
        }

        tr.compare-selected td {
            background: rgba(74, 222, 128, 0.06);
        }

        .provider-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .provider-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-openai { background: #10a37f; }
        .dot-anthropic { background: #cc8a4a; }
        .dot-google { background: #4285f4; }
        .dot-meta { background: #007aff; }
        .dot-mistral { background: #ff7518; }
        .dot-deepseek { background: #4a90e2; }
        .dot-qwen { background: #7367f0; }

        .model-name {
            font-weight: 500;
            color: var(--text-primary);
        }

        .price-cell {
            font-family: var(--font-heading);
            font-weight: 500;
            color: var(--text-secondary);
        }

        .cost-cell {
            font-family: var(--font-heading);
            font-weight: 600;
        }

        .cost-cheapest {
            color: var(--green);
        }

        .cost-mid {
            color: var(--yellow);
        }

        .cost-expensive {
            color: var(--red);
        }

        .compare-btn {
            font-family: var(--font-body);
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
        }

        .compare-btn:hover {
            border-color: var(--border-strong);
            color: var(--text-secondary);
        }

        .compare-btn.active {
            background: var(--green-dim);
            border-color: rgba(74, 222, 128, 0.3);
            color: var(--green);
        }

        /* Comparison Panel */
        .compare-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 32px;
            display: none;
        }

        .compare-panel.visible {
            display: block;
        }

        .compare-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .compare-title {
            font-family: var(--font-heading);
            font-size: 16px;
            font-weight: 600;
        }

        .compare-clear {
            font-family: var(--font-body);
            font-size: 13px;
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }

        .compare-clear:hover {
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        .compare-grid {
            display: grid;
            gap: 16px;
        }

        .compare-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
        }

        .compare-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .compare-card-model {
            font-family: var(--font-heading);
            font-size: 15px;
            font-weight: 600;
        }

        .compare-card-provider {
            font-size: 12px;
            color: var(--text-muted);
        }

        .compare-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .compare-stat {
            text-align: center;
        }

        .compare-stat-label {
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .compare-stat-value {
            font-family: var(--font-heading);
            font-size: 18px;
            font-weight: 600;
        }

        .compare-ratio {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .compare-ratio-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
        }

        .compare-ratio-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .compare-ratio-value {
            font-family: var(--font-heading);
            font-size: 14px;
            font-weight: 600;
        }

        .ratio-cheaper {
            color: var(--green);
        }

        .ratio-more {
            color: var(--red);
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border);
            padding: 24px 0;
            text-align: center;
            margin-top: 48px;
        }

        .footer-text {
            font-size: 13px;
            color: var(--text-muted);
        }

        .footer-link {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.15s;
        }

        .footer-link:hover {
            color: var(--text-primary);
        }

        .footer-updated {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 28px;
            }

            .calc-row {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .header-inner {
                flex-direction: column;
                gap: 8px;
            }

            .logo-tag {
                display: none;
            }

            .compare-stats {
                grid-template-columns: 1fr;
                gap: 8px;
            }

            .calc-input-row {
                flex-wrap: wrap;
            }

            .calc-slider {
                width: 100%;
                flex: none;
            }

            td, th {
                padding: 10px 12px;
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 16px;
            }

            .hero {
                padding: 40px 0 32px;
            }

            .calc-container {
                padding: 16px;
            }
        }

        /* Empty state / info */
        .compare-empty {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Row hover cursor for compare */
        tbody tr {
            cursor: pointer;
        }

        /* Subtle animation */
        .compare-panel {
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<header>
    <div class="container header-inner" id="header-inner">
    </div>
</header>

<main class="container">
    <section class="hero" id="hero">
    </section>

    <section class="section" id="calculator-section">
    </section>

    <section class="section" id="compare-section">
        <div class="compare-panel" id="compare-panel">
        </div>
    </section>

    <section class="section" id="table-section">
    </section>
</main>

<footer id="footer">
</footer>

<script>
(function() {
    "use strict";

    // ========== DATA ==========
    var models = [

        // Anthropic
        { provider: "Anthropic", model: "Claude Opus 4.6", inputCost: 5.00, outputCost: 25.00, capabilities: ["text", "vision", "code", "reasoning"] },
        { provider: "Anthropic", model: "Claude Sonnet 4.6", inputCost: 3.00, outputCost: 15.00, capabilities: ["text", "vision", "code"] },

        { provider: "Google", model: "Gemini 2.5 Pro", inputCost: 1.25, outputCost: 10.00, capabilities: ["text", "vision", "code", "reasoning"] },

        { provider: "Mistral", model: "Mistral Small", inputCost: 0.10, outputCost: 0.30, capabilities: ["text", "code"] },

        { provider: "DeepSeek", model: "DeepSeek V3", inputCost: 0.28, outputCost: 0.42, capabilities: ["text", "code"] },
        { provider: "DeepSeek", model: "DeepSeek R1", inputCost: 0.50, outputCost: 2.18, capabilities: ["text", "code", "reasoning"] },

        { provider: "Qwen", model: "Qwen 3.5 Plus", inputCost: 0.115, outputCost: 0.688, capabilities: ["text", "code"] },

    ];

    var providers = ["OpenAI", "Anthropic", "Google", "xAI", "Meta", "Mistral", "DeepSeek", "Qwen"];

    var providerColors = {
        "OpenAI": "#10a37f",
        "Anthropic": "#cc8a4a",
        "Google": "#4285f4",
        "xAI": "#e5e5e5",
        "Meta": "#007aff",
        "Mistral": "#ff7518",
        "DeepSeek": "#4a90e2",
        "Qwen": "#7367f0"
    };

    // ========== STATE ==========
    var state = {
        inputTokens: 1000000,
        outputTokens: 250000,
        activeProviders: new Set(providers),
        sortColumn: "monthlyCost",
        sortAsc: true,
        compareModels: [],
        maxCompare: 3
    };

    // ========== HELPERS ==========
    function el(tag, cls) {
        var e = document.createElement(tag);
        if (cls) e.className = cls;
        return e;
    }

    function text(str) {
        return document.createTextNode(str);
    }

    function formatTokens(n) {
        if (n >= 1000000000) return (n / 1000000000).toFixed(1) + "B";
        if (n >= 1000000) return (n / 1000000).toFixed(1) + "M";
        if (n >= 1000) return (n / 1000).toFixed(0) + "K";
        return n.toString();
    }

    function formatDollars(n) {
        if (n < 0.01) return "$" + n.toFixed(4);
        if (n < 1) return "$" + n.toFixed(3);
        if (n < 100) return "$" + n.toFixed(2);
        return "$" + n.toFixed(0);
    }

    function monthlyCost(m) {
        return (m.inputCost * state.inputTokens / 1000000) + (m.outputCost * state.outputTokens / 1000000);
    }

    function providerKey(p) {
        return p.toLowerCase().replace(/\s+/g, "");
    }

    function sliderToTokens(val) {
        // Exponential scale: 0-1000 maps to 10K - 10B
        var minLog = Math.log10(10000);
        var maxLog = Math.log10(10000000000);
        var logVal = minLog + (val / 1000) * (maxLog - minLog);
        var raw = Math.pow(10, logVal);
        // Round to nice numbers
        if (raw >= 1000000000) return Math.round(raw / 100000000) * 100000000;
        if (raw >= 100000000) return Math.round(raw / 10000000) * 10000000;
        if (raw >= 10000000) return Math.round(raw / 1000000) * 1000000;
        if (raw >= 1000000) return Math.round(raw / 100000) * 100000;
        if (raw >= 100000) return Math.round(raw / 10000) * 10000;
        return Math.round(raw / 1000) * 1000;
    }

    function tokensToSlider(tokens) {
        var minLog = Math.log10(10000);
        var maxLog = Math.log10(10000000000);
        var logVal = Math.log10(Math.max(10000, tokens));
        return Math.round(((logVal - minLog) / (maxLog - minLog)) * 1000);
    }

    function clearChildren(node) {
        while (node.firstChild) {
            node.removeChild(node.firstChild);
        }
    }

    // ========== BUILD HEADER ==========
    function buildHeader() {
        var container = document.getElementById("header-inner");
        clearChildren(container);

        var left = el("div", "header-left");
        var logo = el("span", "logo");
        logo.appendChild(text("Burn"));
        left.appendChild(logo);

        var tag = el("span", "logo-tag");
        tag.appendChild(text("LLM Cost Calculator"));
        left.appendChild(tag);

        container.appendChild(left);

        var link = el("a", "header-link");
        link.href = "https://fumeilab.com";
        link.target = "_blank";
        link.rel = "noopener";
        link.appendChild(text("fumeilab.com"));
        container.appendChild(link);
    }

    // ========== BUILD HERO ==========
    function buildHero() {
        var section = document.getElementById("hero");
        clearChildren(section);

        var h1 = el("h1");
        h1.appendChild(text("Know what you'll pay."));
        section.appendChild(h1);

        var p = el("p");
        p.appendChild(text("Compare API pricing across every major LLM provider. Input your usage, see your costs."));
        section.appendChild(p);
    }

    // ========== BUILD CALCULATOR ==========
    function buildCalculator() {
        var section = document.getElementById("calculator-section");
        clearChildren(section);

        var header = el("div", "section-header");
        var title = el("h2", "section-title");
        title.appendChild(text("Monthly Usage"));
        header.appendChild(title);
        section.appendChild(header);

        var container = el("div", "calc-container");
        var row = el("div", "calc-row");

        // Input tokens
        var inputField = el("div", "calc-field");
        var inputLabel = el("label");
        inputLabel.appendChild(text("Input Tokens / Month"));
        inputField.appendChild(inputLabel);

        var inputRow = el("div", "calc-input-row");
        var inputSlider = el("input", "calc-slider");
        inputSlider.type = "range";
        inputSlider.min = "0";
        inputSlider.max = "1000";
        inputSlider.value = tokensToSlider(state.inputTokens).toString();
        inputSlider.id = "input-slider";
        inputRow.appendChild(inputSlider);

        var inputNumBox = el("input", "calc-input-num");
        inputNumBox.type = "text";
        inputNumBox.id = "input-tokens-box";
        inputNumBox.value = formatTokens(state.inputTokens);
        inputRow.appendChild(inputNumBox);

        var inputUnit = el("span", "calc-unit");
        inputUnit.appendChild(text("tokens"));
        inputRow.appendChild(inputUnit);

        inputField.appendChild(inputRow);
        row.appendChild(inputField);

        // Output tokens
        var outputField = el("div", "calc-field");
        var outputLabel = el("label");
        outputLabel.appendChild(text("Output Tokens / Month"));
        outputField.appendChild(outputLabel);

        var outputRow = el("div", "calc-input-row");
        var outputSlider = el("input", "calc-slider");
        outputSlider.type = "range";
        outputSlider.min = "0";
        outputSlider.max = "1000";
        outputSlider.value = tokensToSlider(state.outputTokens).toString();
        outputSlider.id = "output-slider";
        outputRow.appendChild(outputSlider);

        var outputNumBox = el("input", "calc-input-num");
        outputNumBox.type = "text";
        outputNumBox.id = "output-tokens-box";
        outputNumBox.value = formatTokens(state.outputTokens);
        outputRow.appendChild(outputNumBox);

        var outputUnit = el("span", "calc-unit");
        outputUnit.appendChild(text("tokens"));
        outputRow.appendChild(outputUnit);

        outputField.appendChild(outputRow);
        row.appendChild(outputField);

        container.appendChild(row);
        section.appendChild(container);

        // Events
        inputSlider.addEventListener("input", function() {
            state.inputTokens = sliderToTokens(parseInt(this.value));
            inputNumBox.value = formatTokens(state.inputTokens);
            renderTable();
            renderCompare();
        });

        outputSlider.addEventListener("input", function() {
            state.outputTokens = sliderToTokens(parseInt(this.value));
            outputNumBox.value = formatTokens(state.outputTokens);
            renderTable();
            renderCompare();
        });

        function parseTokenInput(str) {
            str = str.trim().toUpperCase().replace(/,/g, "");
            var multiplier = 1;
            if (str.endsWith("B")) { multiplier = 1000000000; str = str.slice(0, -1); }
            else if (str.endsWith("M")) { multiplier = 1000000; str = str.slice(0, -1); }
            else if (str.endsWith("K")) { multiplier = 1000; str = str.slice(0, -1); }
            var num = parseFloat(str);
            if (isNaN(num) || num < 0) return null;
            return Math.round(num * multiplier);
        }

        inputNumBox.addEventListener("keydown", function(e) {
            if (e.key === "Enter") this.blur();
        });

        inputNumBox.addEventListener("blur", function() {
            var val = parseTokenInput(this.value);
            if (val !== null && val >= 10000 && val <= 10000000000) {
                state.inputTokens = val;
                inputSlider.value = tokensToSlider(val).toString();
                this.value = formatTokens(val);
                renderTable();
                renderCompare();
            } else {
                this.value = formatTokens(state.inputTokens);
            }
        });

        outputNumBox.addEventListener("keydown", function(e) {
            if (e.key === "Enter") this.blur();
        });

        outputNumBox.addEventListener("blur", function() {
            var val = parseTokenInput(this.value);
            if (val !== null && val >= 10000 && val <= 10000000000) {
                state.outputTokens = val;
                outputSlider.value = tokensToSlider(val).toString();
                this.value = formatTokens(val);
                renderTable();
                renderCompare();
            } else {
                this.value = formatTokens(state.outputTokens);
            }
        });
    }

    // ========== BUILD FILTERS ==========
    function buildFilters(parent) {
        var bar = el("div", "filter-bar");

        var allPill = el("button", "filter-pill active");
        allPill.appendChild(text("All"));
        allPill.addEventListener("click", function() {
            if (state.activeProviders.size === providers.length) {
                // Deselect all
                state.activeProviders.clear();
            } else {
                // Select all
                state.activeProviders = new Set(providers);
            }
            updateFilterPills(bar);
            renderTable();
        });
        bar.appendChild(allPill);

        providers.forEach(function(p) {
            var pill = el("button", "filter-pill provider-" + providerKey(p) + " active");
            pill.dataset.provider = p;
            pill.appendChild(text(p));
            pill.addEventListener("click", function() {
                if (state.activeProviders.has(p)) {
                    state.activeProviders.delete(p);
                } else {
                    state.activeProviders.add(p);
                }
                updateFilterPills(bar);
                renderTable();
            });
            bar.appendChild(pill);
        });

        parent.appendChild(bar);
    }

    function updateFilterPills(bar) {
        var pills = bar.children;
        // All pill
        if (state.activeProviders.size === providers.length) {
            pills[0].classList.add("active");
        } else {
            pills[0].classList.remove("active");
        }
        // Provider pills
        for (var i = 1; i < pills.length; i++) {
            var p = pills[i].dataset.provider;
            if (state.activeProviders.has(p)) {
                pills[i].classList.add("active");
            } else {
                pills[i].classList.remove("active");
            }
        }
    }

    // ========== BUILD TABLE ==========
    function buildTableSection() {
        var section = document.getElementById("table-section");
        clearChildren(section);

        var header = el("div", "section-header");
        var title = el("h2", "section-title");
        title.appendChild(text("Pricing"));
        header.appendChild(title);
        section.appendChild(header);

        buildFilters(section);

        var wrapper = el("div", "table-wrapper");
        var table = el("table");
        table.id = "pricing-table";
        wrapper.appendChild(table);
        section.appendChild(wrapper);

        renderTable();
    }

    function renderTable() {
        var table = document.getElementById("pricing-table");
        if (!table) return;
        clearChildren(table);

        // Filter
        var filtered = models.filter(function(m) {
            return state.activeProviders.has(m.provider);
        });

        // Calculate costs
        filtered.forEach(function(m) {
            m._monthlyCost = monthlyCost(m);
        });

        // Sort
        var sortKey = state.sortColumn;
        filtered.sort(function(a, b) {
            var va, vb;
            switch (sortKey) {
                case "provider": va = a.provider; vb = b.provider; break;
                case "model": va = a.model; vb = b.model; break;
                case "inputCost": va = a.inputCost; vb = b.inputCost; break;
                case "outputCost": va = a.outputCost; vb = b.outputCost; break;
                case "monthlyCost": va = a._monthlyCost; vb = b._monthlyCost; break;
                default: va = a._monthlyCost; vb = b._monthlyCost;
            }
            if (typeof va === "string") {
                var cmp = va.localeCompare(vb);
                return state.sortAsc ? cmp : -cmp;
            }
            return state.sortAsc ? va - vb : vb - va;
        });

        // Determine cost ranges for coloring
        var costs = filtered.map(function(m) { return m._monthlyCost; });
        var minCost = Math.min.apply(null, costs);
        var maxCost = Math.max.apply(null, costs);

        // Header
        var thead = el("thead");
        var headRow = el("tr");

        var columns = [
            { key: "provider", label: "Provider" },
            { key: "model", label: "Model" },
            { key: "inputCost", label: "Input $/M" },
            { key: "outputCost", label: "Output $/M" },
            { key: "monthlyCost", label: "Monthly Cost" },
            { key: "compare", label: "" }
        ];

        columns.forEach(function(col) {
            var th_el = el("th");
            if (col.key === "compare") {
                th_el.style.width = "80px";
                headRow.appendChild(th_el);
                return;
            }
            th_el.appendChild(text(col.label));
            if (state.sortColumn === col.key) {
                th_el.classList.add("sorted");
                var icon = el("span", "sort-icon");
                icon.appendChild(text(state.sortAsc ? "\u25B2" : "\u25BC"));
                th_el.appendChild(icon);
            }
            th_el.addEventListener("click", (function(key) {
                return function() {
                    if (state.sortColumn === key) {
                        state.sortAsc = !state.sortAsc;
                    } else {
                        state.sortColumn = key;
                        state.sortAsc = true;
                    }
                    renderTable();
                };
            })(col.key));
            headRow.appendChild(th_el);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        // Body
        var tbody = el("tbody");
        filtered.forEach(function(m) {
            var tr_el = el("tr");
            var isCompared = state.compareModels.indexOf(m.model) !== -1;
            if (isCompared) tr_el.classList.add("compare-selected");

            // Provider
            var tdProv = el("td");
            var badge = el("span", "provider-badge");
            var dot = el("span", "provider-dot dot-" + providerKey(m.provider));
            badge.appendChild(dot);
            badge.appendChild(text(m.provider));
            tdProv.appendChild(badge);
            tr_el.appendChild(tdProv);

            // Model
            var tdModel = el("td");
            var modelSpan = el("span", "model-name");
            modelSpan.appendChild(text(m.model));
            tdModel.appendChild(modelSpan);
            tr_el.appendChild(tdModel);

            // Input cost
            var tdIn = el("td", "price-cell");
            tdIn.appendChild(text("$" + m.inputCost.toFixed(m.inputCost < 0.1 ? 3 : 2)));
            tr_el.appendChild(tdIn);

            // Output cost
            var tdOut = el("td", "price-cell");
            tdOut.appendChild(text("$" + m.outputCost.toFixed(2)));
            tr_el.appendChild(tdOut);

            // Monthly cost
            var tdCost = el("td", "cost-cell");
            var costVal = m._monthlyCost;
            var costClass = "cost-mid";
            if (maxCost > minCost) {
                var ratio = (costVal - minCost) / (maxCost - minCost);
                if (ratio < 0.2) costClass = "cost-cheapest";
                else if (ratio > 0.7) costClass = "cost-expensive";
            } else {
                costClass = "cost-cheapest";
            }
            tdCost.classList.add(costClass);
            tdCost.appendChild(text(formatDollars(costVal)));
            tr_el.appendChild(tdCost);

            // Compare button
            var tdCompare = el("td");
            var btn = el("button", "compare-btn" + (isCompared ? " active" : ""));
            btn.appendChild(text(isCompared ? "Added" : "Compare"));
            btn.addEventListener("click", function(e) {
                e.stopPropagation();
                toggleCompare(m.model);
            });
            tdCompare.appendChild(btn);
            tr_el.appendChild(tdCompare);

            // Click row to toggle compare
            tr_el.addEventListener("click", function() {
                toggleCompare(m.model);
            });

            tbody.appendChild(tr_el);
        });
        table.appendChild(tbody);
    }

    // ========== COMPARE ==========
    function toggleCompare(modelName) {
        var idx = state.compareModels.indexOf(modelName);
        if (idx !== -1) {
            state.compareModels.splice(idx, 1);
        } else {
            if (state.compareModels.length >= state.maxCompare) {
                state.compareModels.shift();
            }
            state.compareModels.push(modelName);
        }
        renderTable();
        renderCompare();
    }

    function renderCompare() {
        var panel = document.getElementById("compare-panel");
        clearChildren(panel);

        if (state.compareModels.length < 2) {
            panel.classList.remove("visible");
            return;
        }
        panel.classList.add("visible");

        // Header
        var header = el("div", "compare-header");
        var title = el("h3", "compare-title");
        title.appendChild(text("Comparison"));
        header.appendChild(title);

        var clearBtn = el("button", "compare-clear");
        clearBtn.appendChild(text("Clear"));
        clearBtn.addEventListener("click", function() {
            state.compareModels = [];
            renderTable();
            renderCompare();
        });
        header.appendChild(clearBtn);
        panel.appendChild(header);

        // Cards
        var compareData = state.compareModels.map(function(name) {
            return models.find(function(m) { return m.model === name; });
        }).filter(Boolean);

        var gridCols = compareData.length === 2 ? "1fr 1fr" : "1fr 1fr 1fr";
        var grid = el("div", "compare-grid");
        grid.style.gridTemplateColumns = gridCols;

        compareData.forEach(function(m) {
            var card = el("div", "compare-card");

            var cardHeader = el("div", "compare-card-header");
            var dot = el("span", "provider-dot dot-" + providerKey(m.provider));
            cardHeader.appendChild(dot);
            var modelTitle = el("span", "compare-card-model");
            modelTitle.appendChild(text(m.model));
            cardHeader.appendChild(modelTitle);
            card.appendChild(cardHeader);

            var provLabel = el("div", "compare-card-provider");
            provLabel.appendChild(text(m.provider));
            card.appendChild(provLabel);

            var stats = el("div", "compare-stats");

            var statIn = el("div", "compare-stat");
            var statInLabel = el("div", "compare-stat-label");
            statInLabel.appendChild(text("Input $/M"));
            statIn.appendChild(statInLabel);
            var statInVal = el("div", "compare-stat-value");
            statInVal.appendChild(text("$" + m.inputCost.toFixed(m.inputCost < 0.1 ? 3 : 2)));
            statIn.appendChild(statInVal);
            stats.appendChild(statIn);

            var statOut = el("div", "compare-stat");
            var statOutLabel = el("div", "compare-stat-label");
            statOutLabel.appendChild(text("Output $/M"));
            statOut.appendChild(statOutLabel);
            var statOutVal = el("div", "compare-stat-value");
            statOutVal.appendChild(text("$" + m.outputCost.toFixed(2)));
            statOut.appendChild(statOutVal);
            stats.appendChild(statOut);

            var statMonthly = el("div", "compare-stat");
            var statMoLabel = el("div", "compare-stat-label");
            statMoLabel.appendChild(text("Monthly"));
            statMonthly.appendChild(statMoLabel);
            var statMoVal = el("div", "compare-stat-value");
            var mc = monthlyCost(m);
            statMoVal.appendChild(text(formatDollars(mc)));
            statMonthly.appendChild(statMoVal);
            stats.appendChild(statMonthly);

            card.appendChild(stats);
            grid.appendChild(card);
        });

        panel.appendChild(grid);

        // Cost ratios
        if (compareData.length >= 2) {
            var ratioSection = el("div", "compare-ratio");
            var ratioTitle = el("div", "compare-stat-label");
            ratioTitle.style.textAlign = "left";
            ratioTitle.style.marginBottom = "8px";
            ratioTitle.appendChild(text("Cost Ratios"));
            ratioSection.appendChild(ratioTitle);

            // Compare every pair
            for (var i = 0; i < compareData.length; i++) {
                for (var j = i + 1; j < compareData.length; j++) {
                    var a = compareData[i];
                    var b = compareData[j];
                    var costA = monthlyCost(a);
                    var costB = monthlyCost(b);

                    var ratioRow = el("div", "compare-ratio-row");
                    var ratioLabel = el("span", "compare-ratio-label");
                    ratioLabel.appendChild(text(a.model + " vs " + b.model));
                    ratioRow.appendChild(ratioLabel);

                    var ratioValue = el("span", "compare-ratio-value");
                    if (costB > 0 && costA > 0) {
                        if (costA < costB) {
                            var factor = costB / costA;
                            ratioValue.classList.add("ratio-cheaper");
                            ratioValue.appendChild(text(a.model.split(" ").pop() + " is " + factor.toFixed(1) + "x cheaper"));
                        } else if (costB < costA) {
                            var factor2 = costA / costB;
                            ratioValue.classList.add("ratio-cheaper");
                            ratioValue.appendChild(text(b.model.split(" ").pop() + " is " + factor2.toFixed(1) + "x cheaper"));
                        } else {
                            ratioValue.appendChild(text("Same cost"));
                        }
                    }
                    ratioRow.appendChild(ratioValue);
                    ratioSection.appendChild(ratioRow);
                }
            }

            panel.appendChild(ratioSection);
        }
    }

    // ========== BUILD FOOTER ==========
    function buildFooter() {
        var footer = document.getElementById("footer");
        clearChildren(footer);

        var container = el("div", "container");

        var p = el("p", "footer-text");
        p.appendChild(text("Built by "));
        var link = el("a", "footer-link");
        link.href = "https://fumeilab.com";
        link.target = "_blank";
        link.rel = "noopener";
        link.appendChild(text("Fumei Lab"));
        p.appendChild(link);
        container.appendChild(p);

        var updated = el("p", "footer-updated");
        updated.appendChild(text("Pricing last updated March 2026"));
        container.appendChild(updated);

        footer.appendChild(container);
    }

    // ========== INIT ==========
    function init() {
        buildHeader();
        buildHero();
        buildCalculator();
        buildTableSection();
        renderCompare();
        buildFooter();
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();
</script>
